services:
  - type: web
    name: engineering-expert
    env: node
    plan: free
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma db push --accept-data-loss && npm start
    envVars:
      - key: NODE_VERSION
        value: "20.11.0"
      - key: DATABASE_URL
        fromDatabase:
          name: engineering-expert-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: engineering-expert-redis
          type: redis
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: NEXT_PUBLIC_APP_NAME
        value: EngineeringExpert
      - key: RAZORPAY_KEY_ID
        value: rzp_test_SyQk8lkFHKXjYl
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: USE_MOCK_DATA
        value: "false"

  - type: redis
    name: engineering-expert-redis
    plan: free
    maxmemoryPolicy: noeviction

databases:
  - name: engineering-expert-db
    plan: free
