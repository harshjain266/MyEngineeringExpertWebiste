# Local infrastructure for EngineeringExpert.
#   docker compose up -d   →  Postgres on :5432, Redis on :6379
# Credentials match the defaults in .env.example.

services:
  postgres:
    image: postgres:16-alpine
    container_name: ee_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ee_user
      POSTGRES_PASSWORD: ee_password
      POSTGRES_DB: engineering_expert
    ports:
      - "5432:5432"
    volumes:
      - ee_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ee_user -d engineering_expert"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ee_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ee_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  ee_pgdata:
  ee_redisdata:
